name: Build and obfuscate

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npm run build

      - name: Commit built file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app.min.js
          git diff --staged --quiet || git commit -m "Auto-build obfuscated bundle"
          git push
